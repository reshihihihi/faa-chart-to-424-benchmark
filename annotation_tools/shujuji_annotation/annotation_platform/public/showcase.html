<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>航图标注结果展示</title>
    <link rel="stylesheet" href="/showcase.css">
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <strong>航图标注结果展示</strong>
        <span id="chartMeta">加载中</span>
      </div>
      <div class="controls">
        <select id="chartSelect" title="选择航图"></select>
        <input id="chartInput" type="text" spellcheck="false" placeholder="chart_id">
        <button id="loadChartBtn" type="button">载入</button>
        <select id="legSelect" title="选择航段"></select>
        <label class="checkline"><input id="showAllLegs" type="checkbox"> 全部航段</label>
      </div>
    </header>

    <main id="viewerShell" class="viewer-shell">
      <section id="chartPane" class="chart-pane">
        <div id="chartFrame" class="chart-frame">
          <img id="chartImage" alt="航图">
          <svg id="boxOverlay" class="box-overlay" aria-label="证据框"></svg>
        </div>
      </section>
      <div id="showcaseResizeHandle" class="resize-handle" role="separator" aria-label="调节航图和右侧说明宽度" title="拖动调节两栏宽度"></div>
      <aside class="field-pane">
        <div class="field-head">
        <div>
          <span class="eyebrow">当前展示</span>
          <h1 id="panelTitle">航段证据</h1>
        </div>
        <div id="resultSource" class="source-pill">结果来源</div>
      </div>
      <div id="fieldList" class="field-list"></div>
    </aside>
      <svg id="leaderOverlay" class="leader-overlay" aria-hidden="true"></svg>
    </main>

    <div id="toast" class="toast hidden"></div>
    <script src="/showcase.js"></script>
  </body>
</html>
